<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Net Watch</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --green:#16a34a; --red:#dc2626; --blue:#2563eb; --orange:#ea580c; --yellow:#ca8a04; --gray:#9ca3af; --brown:#92400e;
    --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --bg:#fff; --brand:#14532d; --ball:#d9f99d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:var(--ink); }
  #map { position:fixed; inset:0; }
  header {
    position:fixed; z-index:1000; top:0; left:0; right:0;
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
    background: var(--brand); color:#fff; display:flex; align-items:center; gap:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  header .logo { width:28px; height:28px; border-radius:50%; background:var(--ball); position:relative; flex:none; }
  header .logo::before, header .logo::after { content:""; position:absolute; border:2px solid #fff; border-radius:50%; width:26px; height:26px; top:-1px; }
  header .logo::before { left:-15px; } header .logo::after { left:15px; }
  header .logo { overflow:hidden; }
  header h1 { font-size:19px; margin:0; letter-spacing:.3px; }
  header .sub { font-size:12px; opacity:.8; margin-left:auto; text-align:right; }
  .demo { background:#fef3c7; color:#92400e; font-size:12px; padding:6px 12px; position:fixed; z-index:999; left:0; right:0;
          top: calc(env(safe-area-inset-top) + 48px); text-align:center; }

  .fab { position:fixed; z-index:1000; border:none; border-radius:999px; box-shadow:0 3px 10px rgba(0,0,0,.3);
         font-weight:700; font-size:16px; cursor:pointer; }
  #reportBtn { left:50%; transform:translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 22px);
               background:var(--ball); color:var(--brand); padding:16px 26px; font-size:18px; border:3px solid var(--brand); white-space:nowrap; }
  #followBtn, #listBtn, #legendBtn { right:14px; width:52px; height:52px; background:#fff; color:var(--ink); font-size:22px; }
  #followBtn { bottom: calc(env(safe-area-inset-bottom) + 96px); }
  #listBtn   { bottom: calc(env(safe-area-inset-bottom) + 158px); }
  #legendBtn { bottom: calc(env(safe-area-inset-bottom) + 220px); font-size:18px; }
  #followBtn.on { background:var(--blue); color:#fff; }

  .pin { width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.45);
         display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:800; }
  .me { width:20px; height:20px; border-radius:50%; background:var(--blue); border:3px solid #fff;
        box-shadow:0 0 0 6px rgba(37,99,235,.25), 0 1px 4px rgba(0,0,0,.4); }
  .leaflet-div-icon { background:none; border:none; }
  .pinwrap { position:relative; filter:drop-shadow(0 2px 3px rgba(0,0,0,.4)); flex:none; }
  .pinwrap svg { display:block; }
  .pinwrap .pinicon { position:absolute; left:0; display:flex; justify-content:center; color:#fff; }
  .pinwrap.stale { opacity:.85; }

  /* "Up ahead" card */
  #ahead { position:fixed; z-index:1400; left:10px; right:10px; top:calc(env(safe-area-inset-top) + 60px);
           background:#1f2937; color:#fff; border-radius:18px; padding:14px; box-shadow:0 8px 24px rgba(0,0,0,.4);
           transform:translateY(calc(-100% - 140px)); visibility:hidden; transition:transform .25s ease, visibility 0s .25s; max-width:520px; margin:0 auto; }
  #ahead.show { transform:translateY(0); visibility:visible; transition:transform .25s ease; }
  .ah-top { display:flex; gap:12px; align-items:flex-start; }
  .ah-icon { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; border:3px solid #fff; }
  .ah-txt { flex:1; min-width:0; }
  .ah-where { font-size:13px; opacity:.8; }
  .ah-was { font-size:13px; opacity:.8; margin-top:1px; }
  .ah-q { font-size:22px; font-weight:800; margin-top:4px; }
  .ah-x { background:rgba(255,255,255,.12); border:none; color:#fff; width:34px; height:34px; border-radius:50%; font-size:16px; flex:none; }
  .ah-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .ah-btns button { padding:16px; font-size:20px; font-weight:800; border:none; border-radius:14px; cursor:pointer; }
  .ah-yes { background:var(--ball); color:var(--brand); }
  .ah-no { background:#fff; color:#111827; }
  .ah-bar { height:4px; background:rgba(255,255,255,.15); border-radius:2px; margin-top:12px; overflow:hidden; }
  .ah-bar div { height:100%; background:var(--ball); width:100%; transform-origin:left; animation:shrink linear forwards; }
  @keyframes shrink { to { transform:scaleX(0); } }
  .toggle { display:flex; align-items:center; gap:10px; font-size:15px; padding:6px 0; }
  .toggle input { width:22px; height:22px; accent-color:var(--brand); }

  /* Bottom sheet */
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:1500; display:none; }
  #sheet { position:fixed; z-index:1600; left:0; right:0; bottom:0; max-height:86vh; overflow:auto; background:var(--bg);
           border-radius:18px 18px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,.25); transform:translateY(105%);
           transition:transform .22s ease; padding: 10px 16px calc(env(safe-area-inset-bottom) + 18px); }
  #sheet.open { transform:translateY(0); }
  #scrim.open { display:block; }
  .grab { width:44px; height:5px; border-radius:3px; background:var(--line); margin:2px auto 10px; }
  .sheet-head { display:flex; align-items:flex-start; gap:10px; }
  .sheet-head h2 { margin:0; font-size:21px; line-height:1.2; }
  .meta { color:var(--muted); font-size:13px; margin-top:3px; }
  .x { margin-left:auto; border:none; background:#f3f4f6; width:36px; height:36px; border-radius:50%; font-size:18px; cursor:pointer; flex:none; }
  .status { margin:12px 0; padding:10px 12px; border-radius:12px; background:#f9fafb; border-left:6px solid var(--gray); font-size:15px; }
  .status b { display:block; margin-bottom:2px; }
  h3 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:16px 0 8px; }
  .chips { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
  .chip { border:2px solid var(--line); background:#fff; border-radius:12px; padding:11px 8px; font-size:15px; font-weight:600;
          cursor:pointer; user-select:none; display:flex; align-items:center; gap:8px; }
  .chip .ci { width:34px; height:34px; border-radius:50%; background:var(--c); color:#fff; display:flex; align-items:center; justify-content:center; flex:none; }
  .chip.sel { border-color:var(--c); background:#f0fdf4; box-shadow:inset 0 0 0 1px var(--c); }
  .chip.sel::after { content:'✓'; margin-left:auto; color:var(--c); font-weight:900; }
  .si { display:inline-flex; width:24px; height:24px; border-radius:50%; color:#fff; align-items:center; justify-content:center; vertical-align:-6px; margin-right:7px; }
  textarea, input[type=text] { width:100%; border:2px solid var(--line); border-radius:12px; padding:12px; font-size:16px; font-family:inherit; }
  textarea { min-height:64px; resize:vertical; margin-top:8px; }
  input[type=text] { margin-top:8px; }
  .primary { width:100%; margin-top:14px; padding:16px; font-size:18px; font-weight:800; border:none; border-radius:14px;
             background:var(--brand); color:#fff; cursor:pointer; }
  .primary:disabled { opacity:.5; }
  .wa { display:block; text-align:center; text-decoration:none; background:#25d366; color:#fff; font-weight:800; font-size:17px;
        padding:15px; border-radius:14px; margin-top:10px; }
  .done { background:#ecfdf5; border-radius:12px; padding:12px; margin-top:12px; font-weight:600; color:var(--brand); text-align:center; }
  .err { color:var(--red); font-size:14px; margin-top:8px; }
  .links { display:flex; gap:14px; flex-wrap:wrap; margin-top:16px; font-size:14px; }
  .links a, .links button { color:var(--blue); background:none; border:none; padding:0; font-size:14px; cursor:pointer; text-decoration:underline; }
  .rep { border-top:1px solid var(--line); padding:9px 0; font-size:14px; }
  .rep .when { color:var(--muted); font-size:12px; }
  .row { display:flex; align-items:center; gap:10px; padding:12px 2px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row .dot { width:14px; height:14px; border-radius:50%; flex:none; }
  .row .nm { font-weight:600; }
  .row .rt { margin-left:auto; text-align:right; font-size:12px; color:var(--muted); white-space:nowrap; }
  .legend > div { display:flex; align-items:center; gap:12px; padding:3px 0; font-size:15px; }
  .confirm { background:#fef3c7; border-radius:12px; padding:12px; margin-top:12px; font-size:14px; }
  .confirm button { margin:8px 8px 0 0; padding:8px 14px; border-radius:10px; border:none; font-weight:700; cursor:pointer; }
  #toast { position:fixed; z-index:2000; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top) + 64px);
           background:#111827; color:#fff; padding:10px 16px; border-radius:999px; font-size:14px; display:none; max-width:90vw; text-align:center; }
</style>
</head>
<body>
<div id="map"></div>

<header>
  <div class="logo"></div>
  <h1>Net Watch</h1>
  <div class="sub" id="updated">Loading…</div>
</header>
<div class="demo" id="demoBar" hidden>Demo mode: reports are saved on this phone only until the Google Sheet link is added.</div>

<button class="fab" id="legendBtn" aria-label="Map key and settings">⚙</button>
<button class="fab" id="listBtn" aria-label="Court list">☰</button>
<button class="fab" id="followBtn" aria-label="Follow my location">◎</button>
<button class="fab" id="reportBtn">🎾 Report nearest court</button>

<div id="ahead" role="alert"></div>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast"></div>

<script>
/* ================= SETTINGS — edit these two lines ================= */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbylD4z_jxrilAfJul0wppm61pkOY8X1uTI-Zvzr0A1ng4_OLu6YslVDTlWu4jxWE0fpFA/exec';            // paste your Google Apps Script /exec URL here
const GROUP_NAME = 'tennis group'; // shown on the WhatsApp button
/* =================================================================== */

/* ---------- custom report symbols (white line icons drawn inside each pin) ---------- */
const ICONS = {
  netUp:   '<path d="M3 6v14M21 6v14"/><path d="M3 7h18M3 11h18M3 15h18"/><path d="M7.5 7v8M12 7v8M16.5 7v8"/>',
  netDown: '<path d="M3 6v14M21 6v14"/><path d="M3 18c4 2.5 14 2.5 18 0"/><path d="M4 4l16 14" stroke-width="2.6"/>',
  open:    '<circle cx="12" cy="12" r="9"/><path d="M7.5 12.5l3 3 6-7"/>',
  busy:    '<circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M2.5 20c0-3.5 2.5-6 5.5-6s5.5 2.5 5.5 6"/><path d="M14 14.5c.8-.4 1.6-.6 2.5-.6 2.6 0 4.5 2.1 4.5 5.1"/>',
  wet:     '<path d="M12 3c-3.2 4.6-6 7.8-6 11.5a6 6 0 0 0 12 0C18 10.8 15.2 7.6 12 3z"/><path d="M9.5 15.5a2.6 2.6 0 0 0 2.5 2.4"/>',
  dry:     '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
  leaves:  '<path d="M5 19C5 10.5 10.5 5 20 4c-.6 9.5-6.2 15-15 15z"/><path d="M5 19l8.5-8.5"/>',
  snow:    '<path d="M12 2.5v19M3.8 7.2l16.4 9.6M3.8 16.8l16.4-9.6"/><path d="M9.5 4.5L12 6.5l2.5-2M9.5 19.5l2.5-2 2.5 2"/>',
  locked:  '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/>',
  clear:   '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 16v4M16.5 18h4"/>',
  note:    '<path d="M4 5h16v11H10l-4.5 4v-4H4z"/><path d="M8 9h8M8 12.5h5"/>',
  ball:    '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6c3.2 3.2 3.2 9.6 0 12.8M18.4 5.6c-3.2 3.2-3.2 9.6 0 12.8"/>',
};
const svgIcon = (name, size = 20) =>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

// Report options. Order = priority when a report has several (the worst one sets the pin).
// q = the "up ahead" question; no = what gets posted when someone answers "No".
const CONDITIONS = [
  { k: 'Locked / closed', icon: 'locked',  color: 'var(--red)',    label: 'Locked / closed', q: 'Still locked?',          no: 'Open' },
  { k: 'Snow / ice',      icon: 'snow',    color: 'var(--red)',    label: 'Snow or ice',     q: 'Still snow or ice?',     no: 'Clear' },
  { k: 'Nets down',       icon: 'netDown', color: 'var(--red)',    label: 'Nets down',       q: 'Nets still down?',       no: 'Nets up' },
  { k: 'Wet',             icon: 'wet',     color: 'var(--blue)',   label: 'Wet',             q: 'Is it still wet?',       no: 'Dry' },
  { k: 'Busy',            icon: 'busy',    color: 'var(--orange)', label: 'Busy',            q: 'Still busy?',            no: 'Open' },
  { k: 'Leaves / debris', icon: 'leaves',  color: 'var(--brown)',  label: 'Leaves / debris', q: 'Still leaves on court?', no: 'Clear' },
  { k: 'Nets up',         icon: 'netUp',   color: 'var(--green)',  label: 'Nets up',         q: 'Nets still up?',         no: 'Nets down' },
  { k: 'Open',            icon: 'open',    color: 'var(--green)',  label: 'Open',            q: 'Still open?',            no: 'Busy' },
  { k: 'Dry',             icon: 'dry',     color: 'var(--green)',  label: 'Dry',             q: 'Still dry?',             no: 'Wet' },
  { k: 'Clear',           icon: 'clear',   color: 'var(--green)',  label: 'Clear',           q: 'Still clear?',           no: 'Leaves / debris' },
];
const COND = Object.fromEntries(CONDITIONS.map(c => [c.k, c]));
const OPPOSITES = { 'Nets up': 'Nets down', 'Nets down': 'Nets up', 'Wet': 'Dry', 'Dry': 'Wet', 'Busy': 'Open', 'Open': 'Busy' };
const NEAR_MILES = 0.15;           // how close before the "up ahead" question pops up (~250 m)
const ASK_AGAIN_HOURS = 3;         // don't ask about the same court again for this long
const ALERT_SECONDS = 15;          // the question hides itself after this
const CHIP_ORDER = ['Nets up', 'Nets down', 'Open', 'Busy', 'Wet', 'Dry', 'Leaves / debris', 'Clear', 'Snow / ice', 'Locked / closed'];
const STALE_HOURS = 48;       // reports older than this show gray on the map
const REFRESH_MS = 60 * 1000; // re-check the sheet every minute

// Fallback list, used in demo mode (the real list lives in the Google Sheet's Courts tab)
const DEFAULT_COURTS = [
  ['burns','Burns Park','Ann Arbor',4,42.2663,-83.7287],['veterans','Veterans Memorial Park','Ann Arbor',3,42.2843,-83.7720],
  ['west','West Park','Ann Arbor',3,42.2826,-83.7600],['buhr','Buhr Park','Ann Arbor',2,42.2550,-83.7140],
  ['allmendinger','Allmendinger Park','Ann Arbor',1,42.2688,-83.7586],['clinton','Clinton Park','Ann Arbor',2,42.2420,-83.7270],
  ['cranbrook','Cranbrook Park','Ann Arbor',1,42.2380,-83.7420],['hunt','Hunt Park','Ann Arbor',1,42.2905,-83.7570],
  ['leslie','Leslie Park','Ann Arbor',2,42.3092,-83.7365],['northside','Northside Park','Ann Arbor',1,42.2975,-83.7310],
  ['sugarbush','Sugarbush Park','Ann Arbor',2,42.3115,-83.6930],['sylvan','Sylvan Park','Ann Arbor',1,42.2490,-83.7040],
  ['windemere','Windemere Park','Ann Arbor',2,42.2915,-83.6955],['woodbury','Woodbury Park','Ann Arbor',2,42.2580,-83.6840],
  ['arboroaks','Arbor Oaks Park','Ann Arbor',1,42.2330,-83.7090],['southmaple','South Maple Park','Ann Arbor',2,42.2700,-83.7810],
  ['pioneer','Pioneer High School','Ann Arbor',12,42.2620,-83.7480],['huron','Huron High School','Ann Arbor',7,42.2815,-83.7055],
  ['skyline','Skyline High School','Ann Arbor',7,42.3030,-83.7795],['clague','Clague Middle School','Ann Arbor',2,42.3030,-83.7110],
  ['forsythe','Forsythe Middle School','Ann Arbor',2,42.2925,-83.7640],['scarlett','Scarlett Middle School','Ann Arbor',2,42.2450,-83.7000],
  ['mack','Mack / A2 Open School','Ann Arbor',1,42.2852,-83.7590],['palmer','Palmer Field (U-M)','Ann Arbor',10,42.2795,-83.7330],
  ['northcampus','North Campus (U-M)','Ann Arbor',2,42.2930,-83.7190],['montibeller','Montibeller Park','Pittsfield Twp',4,42.2240,-83.7060],
  ['ypsihigh','Ypsilanti High School','Ypsilanti',8,42.2410,-83.6460],
].map(([id,name,area,courts,lat,lng]) => ({id,name,area,courts,lat,lng,notes:''}));

/* ---------- state ---------- */
const DEMO = !SCRIPT_URL;
let courts = [], reports = [], markers = {}, me = null, meMarker = null, accCircle = null, following = true;
let openCourtId = null, lastLoaded = 0;
let askOn = true, voiceOn = true, alertTimer = null, alertCourt = null; // read from storage below

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms); }
function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + ' hr ago';
  const d = Math.round(h / 24); return d + (d === 1 ? ' day ago' : ' days ago');
}
function stamp(t) { return new Date(t).toLocaleString([], { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); }
function distMi(a, b) {
  const R = 3958.8, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtMi = d => d < 0.1 ? 'here' : d.toFixed(1) + ' mi';

/* ---------- status colors ---------- */
function latestFor(id) { return reports.filter(r => r.courtId === id).sort((a, b) => b.t - a.t)[0] || null; }
const condList = rep => (rep?.conditions || '').split(',').map(s => s.trim()).filter(Boolean);
function statusOf(rep) {
  if (!rep || Date.now() - rep.t > STALE_HOURS * 3600e3)
    return { color: 'var(--gray)', label: 'No recent report', icon: 'ball', primary: null, stale: true };
  const have = condList(rep);
  const primary = CONDITIONS.find(c => have.includes(c.k));
  if (primary) return { color: primary.color, label: primary.label, icon: primary.icon, primary };
  return { color: 'var(--yellow)', label: 'See note', icon: 'note', primary: null };
}
function pinHtml(s, size = 1) {
  const w = 38 * size, h = 48 * size;
  return `<div class="pinwrap${s.stale ? ' stale' : ''}" style="width:${w}px;height:${h}px;color:${s.color}">
    <svg viewBox="0 0 38 48" width="${w}" height="${h}"><path d="M19 46C19 46 3 29.5 3 18.5a16 16 0 0 1 32 0C35 29.5 19 46 19 46z" fill="currentColor" stroke="#fff" stroke-width="2.5"/></svg>
    <span class="pinicon" style="width:${w}px;top:${7 * size}px">${svgIcon(s.icon, 20 * size)}</span></div>`;
}

/* ---------- data: Google Sheet or demo ---------- */
async function load() {
  try {
    if (DEMO) {
      courts = store.get('nw_demo_courts', DEFAULT_COURTS);
      reports = store.get('nw_demo_reports', []);
    } else {
      const res = await fetch(SCRIPT_URL, { cache: 'no-store' });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Load failed');
      courts = data.courts; reports = data.reports;
    }
    lastLoaded = Date.now();
    $('#updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
    drawMarkers();
    if (openCourtId && $('#sheet').classList.contains('open') && !$('#sheet').dataset.busy) openCourt(openCourtId, true);
  } catch (e) {
    $('#updated').textContent = 'Offline – retrying';
  }
}
async function send(payload) {
  if (DEMO) {
    if (payload.type === 'report') {
      reports.push({ t: Date.now(), courtId: payload.courtId, conditions: payload.conditions.join(', '), note: payload.note, reporter: payload.reporter });
      store.set('nw_demo_reports', reports);
    } else if (payload.type === 'movePin') {
      const c = courts.find(c => c.id === payload.courtId); c.lat = payload.lat; c.lng = payload.lng; store.set('nw_demo_courts', courts);
    } else if (payload.type === 'addCourt') {
      courts.push({ id: 'c' + Date.now(), name: payload.name, area: '', courts: '', lat: payload.lat, lng: payload.lng, notes: '' });
      store.set('nw_demo_courts', courts);
    }
    return { ok: true };
  }
  // text/plain avoids a CORS preflight, which Apps Script can't answer
  const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  return res.json();
}

/* ---------- map ---------- */
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([42.2780, -83.7400], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
map.on('dragstart', () => setFollow(false));

function drawMarkers() {
  const seen = new Set();
  courts.forEach(c => {
    seen.add(c.id);
    const s = statusOf(latestFor(c.id));
    const icon = L.divIcon({ className: '', iconSize: [38, 48], iconAnchor: [19, 46], html: pinHtml(s) });
    if (markers[c.id]) { markers[c.id].setLatLng([c.lat, c.lng]).setIcon(icon); }
    else { markers[c.id] = L.marker([c.lat, c.lng], { icon }).addTo(map).on('click', () => openCourt(c.id)); }
    markers[c.id].bindTooltip(c.name, { direction: 'top', offset: [0, -44] });
  });
  Object.keys(markers).forEach(id => { if (!seen.has(id)) { map.removeLayer(markers[id]); delete markers[id]; } });
}

/* ---------- GPS (Waze-style follow) ---------- */
function setFollow(on) {
  following = on; $('#followBtn').classList.toggle('on', on);
  if (on && me) map.setView([me.lat, me.lng], Math.max(map.getZoom(), 15));
}
function startGps() {
  if (!navigator.geolocation) { toast('This phone/browser has no GPS access'); return; }
  navigator.geolocation.watchPosition(p => {
    me = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
    const ll = [me.lat, me.lng];
    if (!meMarker) {
      meMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [20, 20], iconAnchor: [10, 10] }), zIndexOffset: 1000 }).addTo(map);
      accCircle = L.circle(ll, { radius: me.acc, color: '#2563eb', weight: 1, fillOpacity: .08 }).addTo(map);
      if (following) map.setView(ll, 15);
    } else { meMarker.setLatLng(ll); accCircle.setLatLng(ll).setRadius(me.acc); if (following) map.panTo(ll); }
    checkUpAhead();
  }, err => {
    if (err.code === 1) toast('Turn on location for this site to follow your drive', 4000);
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

/* ---------- "Up ahead" questions, like Google Maps asking "Is the police still there?" ---------- */
function checkUpAhead() {
  if (!askOn || !me || alertCourt || $('#sheet').classList.contains('open') || !courts.length) return;
  if (me.acc > 150) return; // GPS too fuzzy to say we're near a court
  const asked = store.get('nw_asked', {});
  const near = courts.map(c => ({ c, d: distMi(me, c) }))
    .filter(x => x.d <= NEAR_MILES && Date.now() - (asked[x.c.id] || 0) > ASK_AGAIN_HOURS * 3600e3)
    .sort((a, b) => a.d - b.d)[0];
  if (near) showUpAhead(near.c, near.d);
}

function showUpAhead(c, d) {
  const rep = latestFor(c.id), s = statusOf(rep);
  // What are we asking? Confirm the current report, or (no recent report) ask about the nets.
  const ask = s.primary
    ? { q: s.primary.q, yes: { label: 'Yes', conds: condList(rep) }, no: { label: 'No', conds: swap(condList(rep), s.primary.k, s.primary.no) } }
    : { q: 'Are the nets up?', yes: { label: 'Yes', conds: ['Nets up'] }, no: { label: 'No', conds: ['Nets down'] } };
  alertCourt = c.id;
  const asked = store.get('nw_asked', {}); asked[c.id] = Date.now(); store.set('nw_asked', asked);

  const el = $('#ahead');
  el.innerHTML = `
    <div class="ah-top">
      <span class="ah-icon" style="background:${s.color}">${svgIcon(s.icon, 30)}</span>
      <div class="ah-txt">
        <div class="ah-where">${esc(c.name)} · ${fmtMi(d)}</div>
        <div class="ah-was">${s.primary || s.label === 'See note' ? esc(s.label) + ' · reported ' + ago(rep.t) : 'No recent report'}</div>
        <div class="ah-q">${esc(ask.q)}</div>
      </div>
      <button class="ah-x" aria-label="Dismiss">✕</button>
    </div>
    <div class="ah-btns"><button class="ah-yes">${ask.yes.label}</button><button class="ah-no">${ask.no.label}</button></div>
    <div class="ah-bar"><div style="animation-duration:${ALERT_SECONDS}s"></div></div>`;
  el.classList.add('show');
  el.querySelector('.ah-x').onclick = hideUpAhead;
  el.querySelector('.ah-yes').onclick = () => answerUpAhead(c, ask.yes.conds, rep && s.primary ? 'Confirmed' : '');
  el.querySelector('.ah-no').onclick = () => answerUpAhead(c, ask.no.conds, '');
  clearTimeout(alertTimer); alertTimer = setTimeout(hideUpAhead, ALERT_SECONDS * 1000);
  try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch {}
  speak(`${c.name} ahead. ${ask.q}`);
}
function swap(list, from, to) {
  const out = list.filter(k => k !== from && k !== OPPOSITES[to] && k !== to);
  return [to, ...out];
}
function hideUpAhead() { clearTimeout(alertTimer); $('#ahead').classList.remove('show'); alertCourt = null; }
async function answerUpAhead(c, conditions, note) {
  hideUpAhead();
  toast('Thanks! ' + c.name + ': ' + conditions.join(', '));
  speak('Thanks.');
  const r = await send({ type: 'report', courtId: c.id, conditions, note, reporter: store.get('nw_name', '') }).catch(() => ({ ok: false }));
  if (r.ok) load(); else toast('Couldn’t post — no signal?');
}
function speak(text) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.05; speechSynthesis.speak(u); } catch {}
}

/* keep the screen awake while following, like a nav app */
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !document.hidden && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.onrelease = () => wakeLock = null; } } catch {}
}

/* ---------- bottom sheet ---------- */
function openSheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').classList.add('open'); $('#scrim').classList.add('open'); }
function closeSheet() { $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); openCourtId = null; delete $('#sheet').dataset.busy; }
$('#scrim').onclick = closeSheet;

function openCourt(id, refreshOnly) {
  const c = courts.find(x => x.id === id); if (!c) return;
  openCourtId = id;
  const reps = reports.filter(r => r.courtId === id).sort((a, b) => b.t - a.t);
  const latest = reps[0], s = statusOf(latest);
  const dist = me ? ' · ' + fmtMi(distMi(me, c)) : '';
  const draft = refreshOnly ? collectForm() : null;
  openSheet(`
    <div class="sheet-head">
      <div><h2>${esc(c.name)}</h2><div class="meta">${esc(c.area || '')}${c.courts ? ' · ' + esc(c.courts) + ' courts' : ''}${dist}</div></div>
      <button class="x" onclick="closeSheet()" aria-label="Close">✕</button>
    </div>
    <div class="status" style="border-left-color:${s.color}">
      <b><span class="si" style="background:${s.color}">${svgIcon(s.icon, 16)}</span>${esc(s.label)}</b>
      ${latest ? `${esc(latest.conditions || '')}${latest.note ? ' — “' + esc(latest.note) + '”' : ''}<div class="meta">${ago(latest.t)} · ${stamp(latest.t)}${latest.reporter ? ' · ' + esc(latest.reporter) : ''}</div>` : '<div class="meta">Be the first to report.</div>'}
    </div>

    <h3>What do you see?</h3>
    <div class="chips">${CHIP_ORDER.map(k => { const c = COND[k]; return `<div class="chip" data-k="${esc(k)}" style="--c:${c.color}"><span class="ci">${svgIcon(c.icon, 22)}</span>${esc(k)}</div>`; }).join('')}</div>
    <textarea id="note" placeholder="Anything else? (e.g. 2 of 4 courts free, puddle on court 3)" maxlength="280"></textarea>
    <input type="text" id="who" placeholder="Your name (optional)" maxlength="40" value="${esc(store.get('nw_name', ''))}">
    <button class="primary" id="submitBtn">Post report</button>
    <div id="after"></div>

    <div class="links">
      <a href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}" target="_blank" rel="noopener">Directions</a>
      <button onclick="askMovePin('${esc(c.id)}')">Move pin to my spot</button>
    </div>
    <div id="pinConfirm"></div>

    ${reps.length > 1 ? `<h3>Earlier reports</h3>` + reps.slice(1, 8).map(r => `
      <div class="rep">${esc(r.conditions)}${r.note ? ' — “' + esc(r.note) + '”' : ''}
      <div class="when">${ago(r.t)} · ${stamp(r.t)}${r.reporter ? ' · ' + esc(r.reporter) : ''}</div></div>`).join('') : ''}
  `);
  document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
    ch.classList.toggle('sel');
    // opposites can't both be picked (nets up/down, wet/dry, busy/open)
    const other = OPPOSITES[ch.dataset.k];
    if (other && ch.classList.contains('sel')) document.querySelector(`.chip[data-k="${other}"]`).classList.remove('sel');
  });
  if (draft) restoreForm(draft);
  $('#submitBtn').onclick = () => submitReport(c);
}
function collectForm() {
  if (!$('#note')) return null;
  return { sel: [...document.querySelectorAll('.chip.sel')].map(c => c.dataset.k), note: $('#note').value, who: $('#who').value, after: $('#after').innerHTML };
}
function restoreForm(d) {
  d.sel.forEach(k => { const el = document.querySelector(`.chip[data-k="${k}"]`); if (el) el.classList.add('sel'); });
  $('#note').value = d.note; $('#who').value = d.who; $('#after').innerHTML = d.after;
}

async function submitReport(c) {
  const conditions = [...document.querySelectorAll('.chip.sel')].map(x => x.dataset.k);
  const note = $('#note').value.trim(), reporter = $('#who').value.trim();
  if (!conditions.length && !note) { $('#after').innerHTML = '<div class="err">Tap at least one condition or add a note.</div>'; return; }
  store.set('nw_name', reporter);
  const btn = $('#submitBtn'); btn.disabled = true; btn.textContent = 'Posting…'; $('#sheet').dataset.busy = '1';
  try {
    const r = await send({ type: 'report', courtId: c.id, conditions, note, reporter });
    if (!r.ok) throw new Error(r.error);
    const when = new Date().toLocaleString([], { weekday:'short', hour:'numeric', minute:'2-digit' });
    const msg = `🎾 NET WATCH – ${c.name}\n${conditions.join(', ')}${note ? '\n“' + note + '”' : ''}\n${when}${reporter ? ' · ' + reporter : ''}\n${location.href.split('#')[0]}`;
    btn.textContent = 'Posted ✓';
    $('#after').innerHTML = `<div class="done">Saved with time stamp ${esc(when)}</div>
      <a class="wa" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Send to WhatsApp ${esc(GROUP_NAME)}</a>`;
    await load();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Post report';
    $('#after').innerHTML = '<div class="err">Couldn’t post — check your signal and try again.</div>';
  } finally { delete $('#sheet').dataset.busy; }
}

function askMovePin(id) {
  if (!me) { toast('Waiting for GPS…'); return; }
  const c = courts.find(x => x.id === id), d = distMi(me, c);
  $('#pinConfirm').innerHTML = `<div class="confirm">Move the <b>${esc(c.name)}</b> pin to where you're standing now (${fmtMi(d)} from the current pin)? Only do this if you're at the courts.
    <div><button style="background:var(--brand);color:#fff" onclick="movePin('${esc(id)}')">Move pin</button><button onclick="$('#pinConfirm').innerHTML=''">Cancel</button></div></div>`;
}
async function movePin(id) {
  const r = await send({ type: 'movePin', courtId: id, lat: +me.lat.toFixed(6), lng: +me.lng.toFixed(6) }).catch(() => ({ ok: false }));
  toast(r.ok ? 'Pin moved — thanks!' : 'Couldn’t move the pin'); if (r.ok) { await load(); openCourt(id); }
}

/* ---------- list of courts ---------- */
function openList() {
  const rows = courts.map(c => ({ c, d: me ? distMi(me, c) : null, rep: latestFor(c.id) }))
    .sort((a, b) => a.d != null ? a.d - b.d : a.c.name.localeCompare(b.c.name));
  openSheet(`
    <div class="sheet-head"><div><h2>Courts</h2><div class="meta">${me ? 'Nearest first' : 'A–Z (turn on location to sort by distance)'}</div></div>
    <button class="x" onclick="closeSheet()" aria-label="Close">✕</button></div>
    ${rows.map(({ c, d, rep }) => { const s = statusOf(rep); return `
      <div class="row" onclick="goTo('${esc(c.id)}')">
        <span class="dot" style="background:${s.color}"></span>
        <div><div class="nm">${esc(c.name)}</div><div class="meta">${esc(s.label)}${rep && s.label !== 'No recent report' ? ' · ' + ago(rep.t) : ''}</div></div>
        <div class="rt">${d != null ? fmtMi(d) : ''}</div>
      </div>`; }).join('')}
    <h3>Missing a court?</h3>
    <input type="text" id="newName" placeholder="Court name, e.g. Fuller Park">
    <button class="primary" onclick="addCourt()">Add a court where I'm standing</button>
  `);
}
function goTo(id) { const c = courts.find(x => x.id === id); setFollow(false); map.setView([c.lat, c.lng], 16); openCourt(id); }
async function addCourt() {
  const name = $('#newName').value.trim();
  if (!name) { toast('Type the court name first'); return; }
  if (!me) { toast('Waiting for GPS…'); return; }
  const r = await send({ type: 'addCourt', name, lat: +me.lat.toFixed(6), lng: +me.lng.toFixed(6) }).catch(() => ({ ok: false }));
  toast(r.ok ? name + ' added' : 'Couldn’t add the court'); if (r.ok) { await load(); closeSheet(); }
}

function openLegend() {
  const item = (s, t) => `<div>${pinHtml(s, .72)}<span>${t}</span></div>`;
  openSheet(`<div class="sheet-head"><h2>Map key</h2><button class="x" onclick="closeSheet()" aria-label="Close">✕</button></div>
    <div class="legend" style="margin-top:6px">
      ${CHIP_ORDER.map(k => item({ color: COND[k].color, icon: COND[k].icon }, esc(k))).join('')}
      ${item({ color: 'var(--yellow)', icon: 'note' }, 'Note only — tap to read')}
      ${item({ color: 'var(--gray)', icon: 'ball', stale: true }, `No report in the last ${STALE_HOURS} hours`)}
    </div>
    <p class="meta" style="margin-top:12px">Green = good to play · orange = busy · blue = wet · red = can't play. When a report has several conditions, the pin shows the worst one.</p>
    <h3>Up-ahead questions</h3>
    <label class="toggle"><input type="checkbox" id="askToggle" ${askOn ? 'checked' : ''}> Ask me about courts as I drive by</label>
    <label class="toggle"><input type="checkbox" id="voiceToggle" ${voiceOn ? 'checked' : ''}> Read the question out loud</label>
    <p class="meta">Keep Net Watch open on screen while you drive, like Waze. Answer with one tap only when it's safe — or let it time out.</p>`);
  $('#askToggle').onchange = e => { askOn = e.target.checked; store.set('nw_ask', askOn); };
  $('#voiceToggle').onchange = e => { voiceOn = e.target.checked; store.set('nw_voice', voiceOn); };
}

/* ---------- buttons ---------- */
$('#followBtn').onclick = () => { setFollow(!following); if (!me) toast('Finding you…'); };
$('#listBtn').onclick = openList;
$('#legendBtn').onclick = openLegend;
$('#reportBtn').onclick = () => {
  if (!me) { toast('Waiting for GPS — or tap a court on the map'); return; }
  const nearest = courts.map(c => ({ c, d: distMi(me, c) })).sort((a, b) => a.d - b.d)[0];
  if (!nearest) return;
  map.setView([nearest.c.lat, nearest.c.lng], 16); setFollow(false); openCourt(nearest.c.id);
};
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastLoaded > 15000) load(); });

/* ---------- go ---------- */
askOn = store.get('nw_ask', true); voiceOn = store.get('nw_voice', true);
document.addEventListener('click', keepAwake, { once: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
if (DEMO) $('#demoBar').hidden = false;
setFollow(true);
load();
startGps();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
